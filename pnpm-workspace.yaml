packages:
  - "apps/*"
  - "template"
  - "template/apps/*"
  - "template/packages/*"
  - "packages/*"
  - "games/*"
  - "games/*/apps/*"
  - "games/*/packages/*"

# Dependencies allowed to run install scripts (pnpm fails on any other one that has some).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false

# eslint-config-next supports ESLint 10, but these plugins it bundles still list ESLint 9
# as their latest peer (see "Good to know" in the Next.js ESLint docs).
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"

# One version per dependency: every external dependency is declared here and
# referenced as "catalog:" in package.json files (checked by `pnpm check:catalog`).
# `pnpm add <dep>` adds new dependencies to the catalog.
catalogMode: strict
catalog:
  # Framework
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  server-only: ^0.0.1
  "@vercel/analytics": ^2.0.1

  # Toolchain
  typescript: ~6.0.3
  "@types/node": ^24.19.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  eslint: ^10.12.0
  eslint-config-next: 16.4.0
  vitest: ^5.0.3

  # Styles and UI
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  tw-animate-css: ^1.4.0
  shadcn: ^4.21.4
  radix-ui: ^1.7.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cn: ^0.4.0
  tailwind-merge: ^3.7.0
  input-otp: ^1.5.0
  sonner: ^2.0.8
  vaul: ^1.1.2
  next-themes: ^0.4.6
  motion: ^14.0.0
  leva: ^0.10.1
  lucide-react: ^1.54.0
  "@hugeicons/core-free-icons": ^4.3.5
  "@hugeicons/react": ^1.1.10
  geist: ^1.7.2
  "@fontsource-variable/alegreya": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@fontsource-variable/inter": ^5.3.0

  # 3D
  three: ^0.186.1
  "@types/three": ^0.186.0
  "@react-three/fiber": ^9.8.1
  "@react-three/drei": ^10.7.9
  maath: ^0.10.8

  # Sanity
  sanity: ^6.18.0
  "@sanity/vision": ^6.18.0
  "@sanity/icons": ^5.2.3
  "@sanity/client": ^8.9.0
  "@sanity/image-url": ^2.1.1
  next-sanity: ^13.3.4
  styled-components: ^6.5.3

  # Backend
  "@supabase/supabase-js": ^2.117.3
  sharp: ^0.35.5
  wawoff2: ^2.0.1
